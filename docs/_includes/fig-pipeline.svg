<text x="377" y="50" class="fig-t" text-anchor="middle">hw_controller</text>
<text x="377" y="68" class="fig-s" text-anchor="middle">calibration bursts · gain · scheduler</text>
<path d="M250 54 H164 V134" class="fig-ctl" marker-end="url(#plc)"/>
<text x="172" y="46" class="fig-s">ZMQ :1130</text>
