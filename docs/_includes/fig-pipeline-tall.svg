<svg class="fig fig-tall" viewBox="0 0 330 500" role="img" aria-labelledby="pt-t pt-d">
<title id="pt-t">The journey of a sample through the HeIMDALL pipeline</title>
<desc id="pt-d">A vertical version of the pipeline: tuners, rtl_daq, rebuffer, decimate (u8 to complex float, filtering only when decimating), delay_sync and the output stage (shared memory by default, or TCP port 5000), with hw_controller beside them.</desc>
<defs>
<marker id="pta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fig-arrow"/></marker>
<marker id="ptc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fig-arrow-ctl"/></marker>
</defs>
<rect x="20" y="8" width="190" height="44" rx="8" class="fig-box"/>
<path d="M34 22 h40 M34 30 h40 M34 38 h40" class="fig-lanes"/>
<text x="86" y="35" class="fig-s">5 tuners, one clock</text>
<path d="M115 54 V80" class="fig-flow" marker-end="url(#pta)"/>
<text x="124" y="72" class="fig-m">24 MB/s u8</text>
<rect x="20" y="84" width="190" height="56" rx="10" class="fig-box fig-hot"/>
<circle cx="24" cy="84" r="10" class="fig-num"/><text x="24" y="88" class="fig-numt" text-anchor="middle">1</text>
<text x="115" y="108" class="fig-t" text-anchor="middle">rtl_daq</text>
<text x="115" y="126" class="fig-s" text-anchor="middle">USB capture</text>
<path d="M115 142 V168" class="fig-flow" marker-end="url(#pta)"/>
<text x="124" y="160" class="fig-m">109.2 ms blocks</text>
<rect x="20" y="172" width="190" height="56" rx="10" class="fig-box"/>
<circle cx="24" cy="172" r="10" class="fig-num"/><text x="24" y="176" class="fig-numt" text-anchor="middle">2</text>
<text x="115" y="196" class="fig-t" text-anchor="middle">rebuffer</text>
<text x="115" y="214" class="fig-s" text-anchor="middle">blocks → frames</text>
<path d="M115 230 V256" class="fig-flow" marker-end="url(#pta)"/>
<text x="124" y="248" class="fig-m">0.437 s frames</text>
<rect x="20" y="260" width="190" height="56" rx="10" class="fig-box"/>
<circle cx="24" cy="260" r="10" class="fig-num"/><text x="24" y="264" class="fig-numt" text-anchor="middle">3</text>
<text x="115" y="280" class="fig-t" text-anchor="middle">decimate</text>
<text x="115" y="296" class="fig-s" text-anchor="middle">u8 → cf32</text>
<text x="115" y="309" class="fig-s" text-anchor="middle">FIR if decimating</text>
<path d="M115 318 V344" class="fig-flow" marker-end="url(#pta)"/>
<text x="124" y="336" class="fig-m">96 MB/s cf32</text>
<rect x="20" y="348" width="190" height="56" rx="10" class="fig-box fig-hot"/>
<circle cx="24" cy="348" r="10" class="fig-num"/><text x="24" y="352" class="fig-numt" text-anchor="middle">4</text>
<text x="115" y="372" class="fig-t" text-anchor="middle">delay_sync</text>
<text x="115" y="390" class="fig-s" text-anchor="middle">align + lock</text>
<path d="M115 406 V432" class="fig-flow" marker-end="url(#pta)"/>
<text x="124" y="424" class="fig-m">coherent frames</text>
<rect x="20" y="436" width="190" height="56" rx="10" class="fig-box"/>
<circle cx="24" cy="436" r="10" class="fig-num"/><text x="24" y="440" class="fig-numt" text-anchor="middle">5</text>
<text x="115" y="460" class="fig-t" text-anchor="middle">output</text>
<text x="115" y="478" class="fig-s" text-anchor="middle">shmem or TCP :5000</text>
<rect x="262" y="84" width="60" height="320" rx="10" class="fig-box fig-ctlbox"/>
<text x="292" y="244" class="fig-t" text-anchor="middle" transform="rotate(-90 292 244)">hw_controller</text>
<path d="M262 112 H214" class="fig-ctl" marker-end="url(#ptc)"/>
<text x="238" y="104" class="fig-s" text-anchor="middle">:1130</text>
<path d="M212 384 H258" class="fig-ctl" marker-end="url(#ptc)"/>
<text x="236" y="376" class="fig-s" text-anchor="middle">headers</text>
<path d="M292 440 V408" class="fig-ctl" marker-end="url(#ptc)"/>
<text x="292" y="458" class="fig-s" text-anchor="middle">TCP :5001</text>
</svg>
