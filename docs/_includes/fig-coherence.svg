<svg class="fig fig-coherence" viewBox="0 0 720 230" role="img" aria-labelledby="coh-t coh-d" preserveAspectRatio="xMidYMid meet"><title id="coh-t">Five channels before and after calibration</title><desc id="coh-d">On the left, five sine waves of the same frequency with unrelated phases and amplitudes, one per tuner; a dashed reference line shows that their peaks do not line up. A shaded band in the middle stands for calibration against a shared noise source. On the right, the same five waves are aligned in phase and amplitude, with every peak on the reference line.</desc><line x1="18" y1="31" x2="702" y2="31" class="fig-grid"/><line x1="18" y1="73" x2="702" y2="73" class="fig-grid"/><line x1="18" y1="115" x2="702" y2="115" class="fig-grid"/><line x1="18" y1="157" x2="702" y2="157" class="fig-grid"/><line x1="18" y1="199" x2="702" y2="199" class="fig-grid"/><rect x="300" y="8" width="120" height="214" rx="10" class="fig-band"/><path d="M352.7 16.0 L361.2 21.0 L356.4 26.0 L362.9 31.0 L363.5 36.0 L347.8 41.0 L346.4 46.0 L369.4 51.0 L353.3 56.0 L352.6 61.0 L373.9 66.0 L359.2 71.0 L369.4 76.0 L359.3 81.0 L363.9 86.0 L350.2 91.0 L363.8 96.0 L370.3 101.0 L360.6 106.0 L366.8 111.0 L364.8 116.0 L347.8 121.0 L367.2 126.0 L362.6 131.0 L354.4 136.0 L346.9 141.0 L370.2 146.0 L359.2 151.0 L366.1 156.0 L370.6 161.0 L366.0 166.0 L371.8 171.0 L357.1 176.0 L368.4 181.0 L358.4 186.0 L372.2 191.0 L370.6 196.0 L348.7 201.0 L349.8 206.0 L352.1 211.0" class="fig-noise"/><path d="M24.0 31.0 L26.0 28.3 L28.0 25.8 L30.0 23.5 L32.0 21.6 L34.0 20.2 L36.0 19.3 L38.0 19.0 L40.0 19.3 L42.0 20.2 L44.0 21.6 L46.0 23.5 L48.0 25.8 L50.0 28.3 L52.0 31.0 L54.0 33.7 L56.0 36.2 L58.0 38.5 L60.0 40.4 L62.0 41.8 L64.0 42.7 L66.0 43.0 L68.0 42.7 L70.0 41.8 L72.0 40.4 L74.0 38.5 L76.0 36.2 L78.0 33.7 L80.0 31.0 L82.0 28.3 L84.0 25.8 L86.0 23.5 L88.0 21.6 L90.0 20.2 L92.0 19.3 L94.0 19.0 L96.0 19.3 L98.0 20.2 L100.0 21.6 L102.0 23.5 L104.0 25.8 L106.0 28.3 L108.0 31.0 L110.0 33.7 L112.0 36.2 L114.0 38.5 L116