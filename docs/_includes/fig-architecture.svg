<svg class="fig fig-wide has-tall fig-w950" viewBox="0 0 950 420" role="img" aria-labelledby="ar-t ar-d">
<title id="ar-t">Processes, shared-memory rings and control channels of one instance</title>
<desc id="ar-d">Data plane, left to right: rtl_daq writes a stdout pipe read by rebuffer; rebuffer fills the decimator_in ring; decimate converts to complex float (filtering only when decimating) and fills decimator_out; delay_sync fills delay_sync_iq, which iq_server streams on TCP port 5000. Control plane: hw_controller drives rtl_daq over ZMQ port 1130, reads frame headers from delay_sync through the delay_sync_hwc ring, and accepts 128-byte commands on TCP port 5001. delay_sync serves JSON status on port 5002 and publishes events on port 5003.</desc>
<defs>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fig-arrow"/></marker>
<marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fig-arrow-ctl"/></marker>
</defs>
<rect x="220" y="40" width="400" height="60" rx="10" class="fig-box fig-ctlbox"/>
