<svg class="fig fig-tall" viewBox="0 0 320 690" role="img" aria-labelledby="art-t art-d">
<title id="art-t">Processes, shared-memory rings and control channels of one instance</title>
<desc id="art-d">A vertical version of the architecture. Data plane, top to bottom: rtl_daq writes a stdout pipe read by rebuffer; rebuffer fills the decimator_in ring; decimate converts to complex float and fills decimator_out; delay_sync fills delay_sync_iq, which iq_server streams on TCP port 5000 to consumers. hw_controller, beside them, drives rtl_daq over ZMQ port 1130, reads frame headers from delay_sync and accepts commands on TCP port 5001. delay_sync serves JSON status on port 5002 and publishes events on port 5003.</desc>
