# HeIMDALL DAQ — project site (GitHub Pages, plain Jekyll, no plugins).
#
# Publishing: Settings -> Pages -> Build and deployment -> "Deploy from a branch",
# branch "main", folder "/docs". See docs/README.md.

title: HeIMDALL DAQ
tagline: Coherent multichannel acquisition for KrakenSDR
description: >-
  HeIMDALL DAQ is the coherent data-acquisition chain behind KrakenSDR: five
  RTL-SDR tuners on one clock, calibrated into a single phase-coherent receiver.
as_of: "2026-11-01"

# Published at https://sonoransun.github.io/exheimdall_daq_fw/ (project site).
# url + baseurl are set explicitly so links are right in local builds too;
# every link and asset goes through the relative_url / absolute_url filters.
# For a fork or a custom domain, change both (custom domain: baseurl: "").
url: "https://sonoransun.github.io"
baseurl: "/exheimdall_daq_fw"

# repo_url: base URL of the source repository, used for the footer and for
# links that point outside Documentation/ (for example ../CHANGELOG.md in a
# guide page). Empty means those links render as plain code text.
repo_url: "https://github.com/sonoransun/exheimdall_daq_fw"
repo_branch: main

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: "guide"
    values:
      layout: guide
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - _tools
  - Gemfile
  - Gemfile.lock
  - vendor
