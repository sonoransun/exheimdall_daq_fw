# HeIMDALL DAQ Real-Time Kernel Parameter Tuning
# Place in /etc/sysctl.d/99-heimdall-rt.conf
# (util/install.sh and util/system_tuning.py do this; apply now with
#  sudo sysctl -e -p /etc/sysctl.d/99-heimdall-rt.conf)
#
# Comments must stay on their own lines: sysctl and systemd-sysctl treat
# everything after "=" as the value, so an inline "# ..." would be written
# into the kernel setting and rejected.
#
# "sysctl -e" skips keys the running kernel does not have instead of
# failing, and systemd-sysctl only logs them, so keys that exist only on
# some hosts (the NUMA keys below) stay active. Keys that no current kernel
# has, or that do nothing, are commented out.

# Real-time scheduler optimizations
# Unlimited RT runtime (disable RT throttling)
kernel.sched_rt_runtime_us=-1
# CFS tunables below moved to debugfs in Linux 5.13 and are absent from the
# Pi (6.x) and current distribution kernels; uncomment only on older kernels.
# 1 ms scheduler latency
#kernel.sched_latency_ns=1000000
# 0.1 ms minimum granularity
#kernel.sched_min_granularity_ns=100000
# 0.25 ms wakeup granularity
#kernel.sched_wakeup_granularity_ns=250000
# 0.05 ms migration cost
#kernel.sched_migration_cost_ns=50000

# Memory management optimizations
# Minimal swapping
vm.swappiness=1
# Sync dirty pages at 5% RAM
vm.dirty_ratio=5
# Background flush at 2% RAM
vm.dirty_background_ratio=2
# Expire dirty pages after 5 s
vm.dirty_expire_centisecs=500
# Check dirty pages every 1 s
vm.dirty_writeback_centisecs=100
# NUMA keys: they matter on multi-socket x86_64 hosts and are skipped where
# the kernel has no CONFIG_NUMA / CONFIG_NUMA_BALANCING (e.g. the Pi).
# Disable zone reclaim
vm.zone_reclaim_mode=0
# Disable NUMA balancing
kernel.numa_balancing=0
# Reduce VFS cache pressure
vm.vfs_cache_pressure=50

# Network optimizations for iq_server
# Busy read timeout (microseconds)
net.core.busy_read=50
# Busy poll timeout (microseconds)
net.core.busy_poll=50
# Default receive buffer (256 KB)
net.core.rmem_default=262144
# Default send buffer (256 KB)
net.core.wmem_default=262144
# Max receive buffer (16 MB)
net.core.rmem_max=16777216
# Max send buffer (16 MB)
net.core.wmem_max=16777216
# Network device backlog
net.core.netdev_max_backlog=5000
# TCP receive buffer sizes (min default max)
net.ipv4.tcp_rmem=4096 262144 16777216
# TCP send buffer sizes (min default max)
net.ipv4.tcp_wmem=4096 262144 16777216
# BBR congestion control (loads the tcp_bbr module when it is built as one)
net.ipv4.tcp_congestion_control=bbr
# tcp_low_latency has been a no-op since Linux 4.14
#net.ipv4.tcp_low_latency=1

# Kernel log verbosity and warnings
# Reduce kernel log verbosity
kernel.printk=3 4 1 3
# Don't panic on warnings
kernel.panic_on_warn=0
