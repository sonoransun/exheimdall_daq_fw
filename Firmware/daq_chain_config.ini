[meta]
ini_version = 8
config_name = kraken_default

[hw]
name = kraken5
unit_id = 0
ioo_type = 0
num_ch = 5
en_bias_tee = 0,0,0,0,0
; --- Optional keys, commented out = today's behaviour ---
; Channel i opens the receiver whose EEPROM serial is serial_base + i (absent: 1000).
; Unit k of a multi-unit host is programmed to 1000 + 100*k + i (util/set_unit_serials.sh).
;serial_base = 1000
; Explicit per-channel serials: exactly num_ch distinct 1-8 digit items; wins over serial_base.
;device_serials = 1100,1101,1102,1103,1104
; unit_id also accepts 'auto': the header unit_id is then [federation] instance_id.
; USEPIGPIO builds only. Absent: GPIO 23/24 (today); none: do not initialise pigpio; or A,B
;antenna_switch_gpio = none

[daq]
log_level = 5
daq_buffer_size = 262144
center_freq = 700000000
sample_rate = 2400000
gain = 0
en_noise_source_ctr = 1
ctr_channel_serial_no = 1000
; --- Optional keys, commented out = today's behaviour ---
; Bind address of rtl_daq's ZMQ socket (1130 + offset): *, 0.0.0.0, 127.0.0.1 or localhost
;zmq_listen_address = *
; USB ring buffers and in-flight async transfers per channel (2..64)
;usb_ring_buffers = 8
;usb_async_transfers = 12
; hw_controller :5001 - concurrent connections (1 = today's sequential accept loop)
;ctl_max_connections = 1
; Request wait (1..600 s, advertised as rto) and handler cap (1..120 s, advertised as hmx)
;ctl_request_timeout_sec = 10.0
;ctl_handler_max_sec = 12.0
; Idle timeout of connections that sent XACK, and of every connection, seconds (0 = off)
;ctl_xack_idle_sec = 30
;ctl_idle_timeout_sec = 0

[pre_processing]
cpi_size = 1048576
decimation_ratio = 1
fir_relative_bandwidth = 1.0
fir_tap_size = 1
fir_window = hann
en_filter_reset = 0
; Optional: size the decimator/iq_server shared memory from this config (0 = worst case)
;size_segments_from_config = 0

[calibration]
corr_size = 65536
std_ch_ind = 0
en_iq_cal = 1
amplitude_cal_mode = channel_power
en_gain_tune_init = 0
gain_lock_interval = 0
unified_gain_control = 0
require_track_lock_intervention = 0
cal_track_mode = 2
cal_frame_interval = 687
cal_frame_burst_size = 10
amplitude_tolerance = 2
phase_tolerance = 1
maximum_sync_fails = 10
iq_adjust_source = explicit-time-delay
iq_adjust_amplitude = 0,0,0,0
iq_adjust_time_delay_ns = 0, 0, 0, 0
; --- Optional keys, commented out = today's behaviour ---
;track_decimation = 1
; RECL over :5001 also recalibrates a locked chain
;en_wire_recal = 0
;defer_control_during_burst = 0
; legacy | symmetric (compare |20*log10|r|| with amplitude_tolerance)
;amplitude_tolerance_mode = legacy
;cal_stall_frames = 0
;recal_on_gain_change = 0
; Warn after this many consecutive CAL frames without leaving calibration (0 = off)
;cal_timeout_frames = 0
; Clear the sync flags on frames after a USB ring-buffer overrun
;invalidate_on_overrun = 0
;frames_after_overrun = 1

[adpis]
en_adpis = 0
adpis_proc_size = 8192
adpis_gains_init = 0,0,0,0,0

[data_interface]
out_data_iface_type = shmem
; Optional iq_server keys: concurrent :5000 clients (1 = today), per-frame send deadline (0 = off)
;iq_server_max_clients = 1
;iq_server_frame_deadline_ms = 0

[schedule]
en_schedule = 0
schedule_mode = none
; options: none, file, inline
schedule_file =
frequencies =
gains =
dwell_frames =
repeat_mode = loop
require_cal_on_hop = 1
max_cal_wait_frames = 500

[database]
en_db = 0
db_dir = _db
max_db_size_mb = 500
rotation_max_age_hours = 168
write_batch_size = 50
write_flush_interval_sec = 1.0
hw_snapshot_interval = 100
; Optional: <db_dir>/inst<N> for instance N > 0; write _instance_meta.json at open
;instance_subdir = 0
;write_instance_meta = 0

[monitoring]
en_monitoring = 0
; Syslog
en_syslog = 0
syslog_address = /dev/log
syslog_facility = daemon
syslog_min_severity = warning
; Performance metrics
en_metrics = 0
metrics_window_size = 1000
heartbeat_interval = 100
; Status endpoint
en_status_server = 0
status_server_port = 5002
; ZMQ event publisher
en_zmq_pub = 0
zmq_pub_port = 5003
; Event ring buffer for status queries
event_ring_size = 500
; --- Optional keys, commented out = today's behaviour ---
; Extended STATUS document and the new :5002 verbs
;status_extended = 0
; Refresh the STATUS snapshot every k frames (0 = follow heartbeat_interval)
;status_update_interval = 0
; Seconds without a refresh before STATUS reports stale (0 = auto from the frame period)
;stale_after_sec = 0
;status_max_clients = 8
;en_hwc_state_relay = 0
;event_tag_identity = 0
;event_topic_prefix = 0
;stamp_decimator_drops = 0
;stamp_cal_telemetry = 0

[offload]
; Transport selection per pipeline stage (shm | spi | pcie | usb3 | net)
rebuffer_transport = shm
decimator_transport = shm
delay_sync_transport = shm
; Compute engine selection (auto | cpu_neon | cpu_kfr | fpga | gpu)
fir_engine = auto
fft_engine = auto
; Optional: FFT / cross-correlation worker threads of delay_sync (1..64 or auto = the
; delay_sync_cores count, else the CPU affinity size), skip the copy on drop
;fft_workers = 4
;xcorr_workers = 4
;skip_copy_on_drop = 0

[dma]
enable = 0
channel_memcpy = 7
min_transfer_size = 65536

[fpga]
enable = 0
spi_device = /dev/spidev0.0
spi_speed_hz = 62500000
gpio_drdy = 25
gpio_reset = 26
bitstream = _data_control/heimdall_fpga.bin
offload_fir = 1
offload_xcorr = 0

[gpu]
enable = 0
backend = vc4cl
offload_fft = 1
offload_fir = 0
fft_batch_size = 4

[pcie]
enable = 0
device = 0000:01:00.0
bar_index = 0
driver = xdma

[usb3]
enable = 0
vid = 0x0403
pid = 0x601f
transfer_size = 16384
num_transfers = 32

[hat_uart]
enable = 0
device = /dev/ttyAMA1
baud = 3000000
framing = cobs

[hat_i2c]
enable = 0
bus = 1
speed = 400000
retry_count = 3

[federation]
instance_id = 0
; Port offset = instance_id * port_stride
port_stride = 100
; Federation coordination
en_federation = 0
coordinator_host =
coordinator_port = 6000
peer_list =
; --- Optional cluster keys, commented out = today's behaviour ---
; Identity: node_id default <short hostname>:<instance_id>; cluster_id default 'default'
;node_id =
;cluster_id = default
; Full membership incl. this instance, host:instance_id[@node_id],... (no loopback hosts)
;cluster_members =
; Coordinator election: host:port,... of every coordinator process (empty = one static coordinator)
;coordinator_candidates =
;coordinator_self =
;coordinator_include_self = 0
; Dynamic registration with the coordinator (needs en_federation = 1)
;advertise_host =
;register_with_coordinator = 0
;register_interval_sec = 5.0
; Peer health: mesh | hub | off, polling, up/down/flap rules
; (peer_down_misses: empty/absent = time rule; e.g. 3 = down after 3 misses)
;health_mode = mesh
;health_poll_interval = 5.0
;peer_timeout = 2.0
;peer_up_successes = 1
;peer_down_misses =
;peer_flap_window_sec = 0
;peer_flap_threshold = 0
;emit_peer_health_events = 0
;health_workers = 1
;stamp_node_id = 0
;fence_max_term_jump = 1000
; :6000 / router stats authentication: token (printable, no spaces) and CIDR allow-list
;auth_token =
;allow_cidrs =
; Coordinator and router keys (election_*, fanout_*, router_*, ...) belong in federation.ini;
; validate it with: python3 ini_checker.py federation.ini --federation

[amplification]
; External LNA / inline-amplifier gain-staging on top of the tuner IF gain.
; Disabled by default; all values are per-channel comma lists of length num_ch.
en_amplification = 0
; External LNA gain, CONTINUOUS dB (never routed through the R820T valid_gains quantizer)
ext_lna_gains_db = 0,0,0,0,0
; External LNA noise figure, dB (used for the cascaded Friis noise-figure budget)
ext_lna_nf_db = 0,0,0,0,0
; External LNA output-referred 1 dB compression point, dBm (99 = not modelled)
ext_lna_p1db_dbm = 99,99,99,99,99
; RTL-SDR tuner reference noise figure, dB (R820T ~3.5 dB)
tuner_nf_db = 3.5
; Assumed antenna-port input level for the P1dB headroom estimate, dBm (advisory)
expected_input_dbm = -60
; Warn when the estimated output is within this margin of P1dB, dB
p1db_margin_db = 3
; Warn when total system gain exceeds this ceiling, dB
max_total_gain_db = 80
; Runtime inline-LNA bias-tee control (see rtl_daq.c 'b' command). GPIO 0 is reserved
; for the noise source, so the ctr/calibration channel can never be bias-powered.
en_bias_tee_runtime = 0
bias_tee_state = 0,0,0,0,0
; Optional frequency-dependent LNA response: "fMHz:gain_db:nf_db;..." (empty = flat)
lna_freq_table =
; Optional: apply bias_tee_state once at hw_controller start
;apply_bias_tee_at_init = 0

[antenna]
; Directional / high-gain antenna profile. Feeds the gain/NF budget and the
; orientation boresight correction. Disabled by default.
en_antenna_profile = 0
profile_name = isotropic
element_gain_dbi = 0
beamwidth_az_deg = 360
beamwidth_el_deg = 360
; vertical | horizontal | rhcp | lhcp | slant45 | dual
polarization = vertical
cable_loss_db = 0
connector_loss_db = 0
; Mechanical -> electrical boresight offset applied to commanded bearings
boresight_az_offset_deg = 0
boresight_el_offset_deg = 0

[orientation]
; Dynamic antenna orientation (rotator / pan-tilt). Disabled by default.
en_orientation = 0
; mock | gs232 | pwm_servo | i2c_pantilt
backend = mock
device = /dev/ttyUSB0
baud = 9600
i2c_bus = 1
i2c_address = 0x40
az_pwm_channel = 0
el_pwm_channel = 1
az_min_deg = 0
az_max_deg = 360
el_min_deg = 0
el_max_deg = 90
az_park_deg = 0
el_park_deg = 0
slew_rate_dps = 6.0
settle_frames = 5
position_tolerance_deg = 1.0
home_on_start = 0
; manual | fixed | external | scan_peak
bearing_mode = external
; Minimum delay_sync sync_state that permits motion (don't slew mid-calibration)
min_sync_state = 5
en_scan = 0
scan_az_start = 0
scan_az_stop = 350
scan_az_step = 10
scan_el_start = 0
scan_el_stop = 0
scan_el_step = 10
scan_dwell_frames = 20

; [host]
; Optional section: CPU layout, RT priorities, host tuning and the instance registry.
; Commented out = today's behaviour.
; Four distinct cores for rtl_daq | rebuffer+decimate | delay_sync+iq_server | hw_controller
;cpu_cores = 0,1,2,3
;delay_sync_cores =
; Subtracted from every RT priority (0..81)
;rt_priority_offset = 0
; warn | refuse | allow
;allow_core_sharing = warn
; always | auto | 1 | 0
;host_tuning = always
; off | warn | strict
;preflight = off
; Registry, instance lock and duplicate guard ($HEIMDALL_RUN_DIR, default /run/heimdall)
;instance_registry = 0
; legacy | refuse (refuse needs instance_registry = 1)
;instance_guard = legacy
;usb_irq_core =
;usb_controller =
;health_thread_sched_other = 0
