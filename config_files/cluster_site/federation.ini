; HeIMDALL federation preset: coordinator configuration of the example cluster 'site-a'
; (see daq_chain_config.ini next to this file). Generated by util/cluster_cfg_gen.py, then
; require_quorum and allow_cidrs were added by hand. Install as
; /etc/heimdall/federation.ini on hosta, hostb and hostc (heimdall-coordinator.service) and
; validate with: python3 Firmware/ini_checker.py /etc/heimdall/federation.ini --federation
[federation]
cluster_id = site-a
port_stride = 100
; every instance of the cluster (host:instance_id), incl. the coordinator hosts' own
cluster_members = hosta:0,hosta:1,hostb:0
coordinator_port = 6000
; election candidates; each coordinator finds itself by host + listen port
coordinator_candidates = hosta:6000,hostb:6000,hostc:6000
; leadership and mutating verbs need a majority (2 of the 3 candidates)
require_quorum = 1
; only the site LAN may send commands; set auth_token (or --auth-token-file) as well
allow_cidrs = 192.168.10.0/24
