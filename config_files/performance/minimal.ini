; HeIMDALL DAQ performance profile "minimal": low-power hosts and development machines.
; A snippet, not a full config: util/provision_instance.py --profile minimal merges these
; keys into the instance INI (after its defaults, before the explicit flags).
; See README.md for the mapping from the legacy minimal.conf.

[host]
; Lower every RT tier by 4 (99/94/92/90/88/82 -> 95/90/88/86/84/78)
rt_priority_offset = 4
; Shared cores only warn (development hosts often run more instances than core groups)
allow_core_sharing = warn
; Capacity pre-flight prints its findings and never blocks a start
preflight = warn

[offload]
; One FFT / cross-correlation worker: least CPU, results are bit-identical for any count
fft_workers = 1
xcorr_workers = 1
