; HeIMDALL DAQ performance profile "maximum": dedicated real-time hosts.
; A snippet, not a full config: util/provision_instance.py --profile maximum merges these
; keys into the instance INI (after its defaults, before the explicit flags).
; Pair it with --delay-sync-cores so the FFT workers get cores of their own.
; See README.md for the mapping from the legacy maximum.conf.

[host]
; Today's RT tiers 99/94/92/90/88/82
rt_priority_offset = 0
; A start whose cpu_cores overlap another live instance's cores is refused
allow_core_sharing = refuse
; A failed capacity pre-flight blocks the start (exit 4)
preflight = strict

[offload]
; One worker per [host] delay_sync_cores entry (else per core of delay_sync's affinity)
fft_workers = auto
xcorr_workers = auto
