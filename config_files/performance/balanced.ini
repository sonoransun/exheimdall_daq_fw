; HeIMDALL DAQ performance profile "balanced": production default.
; A snippet, not a full config: util/provision_instance.py --profile balanced merges these
; keys into the instance INI (after its defaults, before the explicit flags).
; See README.md for the mapping from the legacy balanced.conf.

[host]
; Today's RT tiers 99/94/92/90/88/82
rt_priority_offset = 0
; A start whose cpu_cores overlap another live instance's cores is refused
allow_core_sharing = refuse
; Capacity pre-flight prints its findings and never blocks a start
preflight = warn

[offload]
; One worker per core delay_sync may run on: the [host] delay_sync_cores count, else its
; CPU affinity (the single T2 core when delay_sync_cores is empty)
fft_workers = auto
xcorr_workers = auto
